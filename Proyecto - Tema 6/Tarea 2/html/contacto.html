<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - NEXO</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline-block;
            margin-right: 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
        }

        main {
            padding: 20px;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <img src="../assets/nexo_logo.png" alt="logo nexo" style="width: 500px; height: 300px;">
            <nav>
                <ul>
                    <li><a href="index.html" style="text-decoration: none;">Inicio</a></li>
                    <li><a href="actividades.html" style="text-decoration: none;">Actividades</a></li>
                    <li><a href="tarifas.html" style="text-decoration: none;">Tarifas</a></li>
                    <li><a href="conocenos.html" style="text-decoration: none;">Conócenos</a></li>
                    <li><a href="contacto.html" style="text-decoration: none;">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contacto">
            <h1>Contacto y Ubicación</h1>
            <p><strong>Horario:</strong> Lunes a Viernes de 07:00 a 22:30 | Sábados de 09:00 a 14:00</p>
            <p><strong>Teléfono:</strong> 600 000 000</p>
            <p><strong>Email:</strong> info@nexoclub.es</p>

            <h2>Envíanos un mensaje</h2>
            <form action="#" method="post">
                <p>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="mensaje">Consulta:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                </p>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; NEXO</p>
    </footer>
</body>

</html>
